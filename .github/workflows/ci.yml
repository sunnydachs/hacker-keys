name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Only lines that still receive security patches. Node 20 (EOL
        # 2026-04-30) used to be listed here.
        # scripts/check_runtimes.py fails the build if this list goes stale.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Check the matrix versions are still supported
      run: python3 scripts/check_runtimes.py
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm test
    - name: Serve smoke test (Node 22.x only)
      if: matrix.node-version == '22.x'
      run: |
        node -e "
        const http = require('http');
        const fs = require('fs');
        const path = require('path');
        const mime = {'.html': 'text/html', '.js': 'text/javascript', '.css': 'text/css'};
        const server = http.createServer((req, res) => {
          const file = path.join('public', req.url === '/' ? 'index.html' : req.url);
          try {
            const data = fs.readFileSync(file);
            res.writeHead(200, {'Content-Type': mime[path.extname(file)] || 'application/octet-stream'});
            res.end(data);
          } catch { res.writeHead(404); res.end(); }
        });
        server.listen(8091, async () => {
          const get = (u) => new Promise((resolve, reject) => {
            http.get('http://127.0.0.1:8091' + u, (r) => {
              let b = ''; r.on('data', c => b += c); r.on('end', () => resolve({code: r.statusCode, body: b}));
            }).on('error', reject);
          });
          const index = await get('/');
          if (index.code !== 200) throw new Error('index 404');
          const js = await get('/typer.js');
          if (js.code !== 200) throw new Error('typer.js 404');
          if (!/export const THEMES/.test(js.body)) throw new Error('typer.js malformed');
          const css = await get('/styles.css');
          if (css.code !== 200) throw new Error('styles.css 404');
          console.log('serve smoke test: all 3 assets 200');
          server.close();
        });
        "
